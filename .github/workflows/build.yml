name: Build and validate template plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@c735c409609cbf6a421394f5413ea803cd50e93b
    with:
      axolotl-ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
      phpstan: max
      php-version: '8.1'
      retention-days: 14
    permissions:
      contents: read
