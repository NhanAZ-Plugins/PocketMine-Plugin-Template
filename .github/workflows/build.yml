name: Build plugin PHAR

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@b79fba11584ac0f61145b2fbac42420072c131b0
    with:
      devtools-ref: b79fba11584ac0f61145b2fbac42420072c131b0
      php-version: '8.1'
      retention-days: 14
    permissions:
      contents: read
