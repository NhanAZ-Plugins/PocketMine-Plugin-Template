name: Build and validate template plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@v2
    with:
      axolotl-ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1
      phpstan: max
      php-version: '8.4'
    permissions:
      contents: read
