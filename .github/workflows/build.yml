name: Build plugin PHAR

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@v1.0.0
    with:
      devtools-ref: 2d5f6011acb5c478d2201a9987d3687e937217a4
      php-version: '8.1'
      retention-days: 14
    permissions:
      contents: read
